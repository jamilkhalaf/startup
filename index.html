<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySync</title>
    <!-- Bootstrap CSS framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1 id="brand">StudySync</h1>
        <nav>
          <menu>
            <li><a class="active" href="index.html">Login</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="tasks.html">Tasks</a></li>
            <li><a href="rooms.html">Study Rooms</a></li>
            <li><a href="leaderboard.html">Leaderboard</a></li>
            <li><a href="profile.html">Profile</a></li>
          </menu>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="login">
        <div class="login-intro">
          <h2>Welcome to StudySync</h2>
          <p>Organize your work and study alongside friends in real time.</p>
          <img src="studysync.jpg" alt="Student studying at a desk" />
        </div>

        <!-- Login placeholder: will be wired to the authentication service later -->
        <div class="panel">
          <h3>Sign in</h3>
          <form method="get" action="dashboard.html">
            <div class="field">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" placeholder="your username" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="password" />
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="submit">Login</button>
              <button type="submit">Create Account</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <span>Jamil Khalaf</span>
        <a href="https://github.com/jamilkhalaf/startup">GitHub</a>
      </div>
    </footer>
  </body>
</html>
